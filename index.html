<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CS2 Skin Wishlist</title>
  <meta name="description" content="Minimal local CS2 skin wishlist. No login, no tracking, wishlist is saved in localStorage." />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #151821;
      --panel-2: #1b1f2a;
      --line: #2d3442;
      --text: #e8eaf0;
      --muted: #8b93a3;
      --soft: #c7ccd6;
      --accent: #9fb3ff;
      --danger: #ff9b9b;
      --ok: #9be6bb;
      --shadow: 0 22px 80px rgba(0,0,0,.32);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(159,179,255,.10), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(155,230,187,.06), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .app {
      width: min(1480px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 56px);
      letter-spacing: -.05em;
      line-height: .95;
    }

    .brand p {
      max-width: 780px;
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .status {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
      color: var(--muted);
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(21,24,33,.76);
      color: var(--soft);
      white-space: nowrap;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--danger); }


    .view-toggle-btn {
      width: 100%;
      white-space: nowrap;
    }

    .search-panel {
      min-width: 0;
    }

    .layout.wishlist-view .wishlist {
      order: 1;
      position: static;
      width: 100%;
    }

    .layout.wishlist-view .search-panel {
      order: 2;
      position: sticky;
      top: 16px;
      align-self: start;
      width: 100%;
    }

    .layout.wishlist-view .search-panel .controls {
      grid-template-columns: 1fr;
    }

    .layout.wishlist-view .search-panel .toolbar {
      align-items: center;
    }

    .layout.wishlist-view .search-panel .toolbar-info {
      width: 100%;
      min-height: 0;
      padding-top: 2px;
    }

    .layout.wishlist-view .search-panel .grid {
      grid-template-columns: 1fr;
    }

    .layout.wishlist-view .search-panel .content {
      max-height: calc(100vh - 260px);
      overflow: auto;
    }

    .layout.wishlist-view .search-panel .card {
      min-height: 236px;
    }

    .layout.wishlist-view .wishlist .wish-list {
      gap: 14px;
    }

    @media (max-width: 1050px) {
      .layout.wishlist-view .search-panel {
        position: static;
      }

      .layout.wishlist-view .search-panel .content {
        max-height: none;
        overflow: visible;
      }
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 22px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      background: rgba(21, 24, 33, .82);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .panel-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
    }

    .panel-head h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .panel-head small { color: var(--muted); }

    .controls {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 10px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(15,17,21,.4);
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    input, select, textarea {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0e1118;
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(159,179,255,.65);
      box-shadow: 0 0 0 3px rgba(159,179,255,.12);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .btn {
      border: 1px solid var(--line);
      color: var(--text);
      background: #11141c;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }

    .btn:hover { background: #181c26; border-color: #455064; transform: translateY(-1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn.primary { background: rgba(159,179,255,.13); border-color: rgba(159,179,255,.32); }
    .btn.danger { color: #ffd0d0; background: rgba(255,155,155,.08); border-color: rgba(255,155,155,.24); }

    .content { padding: 18px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }

    .card {
      min-height: 252px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(27,31,42,.95), rgba(18,21,29,.95));
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .skin-img-wrap {
      height: 132px;
      display: grid;
      place-items: center;
      padding: 12px;
      background: linear-gradient(135deg, rgba(255,255,255,.045), transparent), rgba(255,255,255,.02);
      border-bottom: 1px solid var(--line);
    }

    .skin-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 14px 20px rgba(0,0,0,.45));
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .skin-name { font-size: 14px; line-height: 1.25; font-weight: 650; }
    .meta { color: var(--muted); font-size: 12px; line-height: 1.35; }

    .rarity {
      width: fit-content;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid currentColor;
      font-size: 11px;
      opacity: .92;
    }

    .card-actions { margin-top: auto; display: flex; gap: 8px; align-items: center; }
    .card-actions .btn { width: 100%; padding: 8px 10px; font-size: 13px; }

    .empty {
      padding: 38px 18px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 16px;
    }

    .wishlist { position: sticky; top: 16px; }
    .wish-list { display: flex; flex-direction: column; gap: 12px; }

    .weapon-group {
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(15,17,21,.45);
    }

    .weapon-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--soft);
      font-weight: 700;
    }

    .weapon-head span:last-child { color: var(--muted); font-weight: 500; font-size: 12px; }


    .count-partial,
    .count-complete {
      display: inline-block;
      margin-left: .35em;
    }

    .weapon-head {
      width: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .weapon-head:hover {
      background: rgba(255,255,255,.025);
    }

    .weapon-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .collapse-icon {
      width: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .wish-items {
      display: block;
    }

    .weapon-group.collapsed .wish-items {
      display: none;
    }

    .weapon-group.collapsed .weapon-head {
      border-bottom: 0;
    }

    .wish-item {
      display: grid;
      grid-template-columns: 74px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(45,52,66,.7);
    }


    .wish-item.owned {
      background: rgba(155, 230, 187, .075);
    }

    .wish-item.owned .wish-title {
      color: var(--ok);
    }

    .wish-item.owned img {
      opacity: .78;
    }

    .wish-controls {
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: center;
    }

    .owned-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #11141c;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
    }

    .owned-btn:hover {
      color: var(--ok);
      border-color: rgba(155,230,187,.35);
    }

    .owned-btn.active {
      color: var(--ok);
      border-color: rgba(155,230,187,.45);
      background: rgba(155,230,187,.11);
    }

    .wish-item:last-child { border-bottom: 0; }
    .wish-item img { width: 74px; height: 46px; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
    .wish-title { font-size: 13px; font-weight: 650; line-height: 1.28; }
    .wish-meta { margin-top: 3px; color: var(--muted); font-size: 11px; }





    .saved-tools {
      display: grid;
      gap: 8px;
      padding: 0 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .saved-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .saved-load-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) .7fr .7fr;
      gap: 8px;
    }

    .saved-tools .btn {
      padding: 8px 10px;
      font-size: 13px;
    }

    .full-btn {
      width: 100%;
    }

    @media (max-width: 740px) {
      .saved-buttons,
      .saved-load-row {
        grid-template-columns: 1fr;
      }
    }

    .share-tools {
      display: grid;
      gap: 8px;
      padding: 0 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .share-buttons {
      display: grid;
      grid-template-columns: 1.2fr .9fr 1fr;
      gap: 8px;
    }

    .share-buttons .btn {
      padding: 8px 10px;
      font-size: 13px;
    }

    #shareCodeInput {
      min-height: 74px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.35;
    }

    @media (max-width: 740px) {
      .share-buttons {
        grid-template-columns: 1fr;
      }
    }

    .wishlist-tools {
      display: flex;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .wishlist-tools .btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 13px;
    }

    .family-group {
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(15,17,21,.45);
    }

    .family-group + .family-group {
      margin-top: 12px;
    }

    .family-head {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.025);
      color: var(--soft);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 11px 12px;
      font: inherit;
      font-weight: 800;
      text-align: left;
    }

    .family-head:hover { background: rgba(255,255,255,.045); }

    .family-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .family-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
    }

    .family-group.collapsed > .family-body { display: none; }
    .family-group.collapsed > .family-head { border-bottom: 0; }
    .family-group .weapon-group { border-radius: 14px; background: rgba(15,17,21,.36); }
    .family-group .weapon-group + .weapon-group { margin-top: 0; }
    .family-group .weapon-head { padding-left: 10px; padding-right: 10px; }
    .standalone-items { display: block; }

    .wish-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .mini-btn {
      border: 1px solid var(--line);
      color: var(--soft);
      background: #11141c;
      border-radius: 9px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.2;
    }

    .mini-btn:hover {
      border-color: rgba(159,179,255,.4);
      color: var(--text);
      background: #181c26;
    }

    .mini-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      border-style: dashed;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #11141c;
      border-radius: 10px;
      cursor: pointer;
    }

    .icon-btn:hover { color: var(--danger); border-color: rgba(255,155,155,.3); }

    .notice {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid rgba(159,179,255,.22);
      background: rgba(159,179,255,.07);
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: #11141c;
      color: var(--text);
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      box-shadow: var(--shadow);
      z-index: 10;
    }



    .count-partial {
      color: var(--danger);
      font-weight: 750;
    }

    .count-complete {
      color: var(--ok);
      font-weight: 750;
    }

    .toolbar-info {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      padding: 0 4px;
      min-height: 42px;
    }

    @media (max-width: 740px) {
  
    .count-partial {
      color: var(--danger);
      font-weight: 750;
    }

    .count-complete {
      color: var(--ok);
      font-weight: 750;
    }

    .toolbar-info {
        width: 100%;
        min-height: 0;
        padding-top: 2px;
      }
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    .hidden { display: none !important; }

    @media (max-width: 1050px) {
      .layout { grid-template-columns: 1fr; }
      .wishlist { position: static; }
    }

    @media (max-width: 740px) {
      .app { width: min(100vw - 20px, 1480px); padding-top: 18px; }
      .topbar { grid-template-columns: 1fr; }
      .status { align-items: flex-start; }
      .controls { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .card { min-height: 238px; }
      .skin-img-wrap { height: 116px; }
    }
  
    /* v7: hard image clamp.
       Some knife/glove PNGs have large transparent/visual bounds and can overlap text.
       These overrides force the image to stay inside its own area. */
    .card {
      position: relative !important;
      overflow: hidden !important;
    }

    .skin-img-wrap {
      height: 118px !important;
      max-height: 118px !important;
      flex: 0 0 118px !important;
      overflow: hidden !important;
      position: relative !important;
      z-index: 1 !important;
      padding: 10px 16px !important;
      isolation: isolate !important;
    }

    .skin-img-wrap img {
      max-width: 88% !important;
      max-height: 94px !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
      display: block !important;
      pointer-events: none !important;
      user-select: none !important;
      transform: scale(.9) !important;
      transform-origin: center center !important;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)) !important;
    }

    .card-body {
      position: relative !important;
      z-index: 5 !important;
      background: linear-gradient(180deg, rgba(24,27,34,1), rgba(18,21,29,1)) !important;
      border-top: 1px solid var(--line) !important;
    }

    @media (max-width: 740px) {
      .skin-img-wrap {
        height: 104px !important;
        max-height: 104px !important;
        flex-basis: 104px !important;
      }

      .skin-img-wrap img {
        max-height: 78px !important;
        max-width: 84% !important;
        transform: scale(.84) !important;
      }
    }

  
    /* v19 layout switch + redesigned wishlist mode */
    .view-switch {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(17, 20, 28, .88);
      color: var(--muted);
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
      user-select: none;
    }

    .view-switch:hover {
      border-color: rgba(159,179,255,.42);
      background: rgba(24,28,38,.95);
      transform: translateY(-1px);
    }

    .view-switch-label {
      font-size: 12px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: .01em;
    }

    .view-switch-track {
      width: 48px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(159,179,255,.28);
      background: rgba(15,17,21,.9);
      padding: 3px;
      position: relative;
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.025);
    }

    .view-switch-thumb {
      width: 18px;
      height: 18px;
      display: block;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 4px 14px rgba(159,179,255,.34);
      transform: translateX(0);
      transition: transform .18s ease, background .18s ease;
    }

    .view-switch.active {
      color: var(--soft);
      border-color: rgba(155,230,187,.28);
      background: rgba(155,230,187,.055);
    }

    .view-switch.active .view-switch-track {
      border-color: rgba(155,230,187,.36);
    }

    .view-switch.active .view-switch-thumb {
      transform: translateX(22px);
      background: var(--ok);
      box-shadow: 0 4px 14px rgba(155,230,187,.28);
    }

    .layout.wishlist-view {
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
    }

    .layout.wishlist-view .wishlist {
      order: 1;
      position: static;
      width: 100%;
      border-color: rgba(155,230,187,.18);
      background:
        radial-gradient(circle at top left, rgba(155,230,187,.055), transparent 24rem),
        rgba(21,24,33,.86);
    }

    .layout.wishlist-view .search-panel {
      order: 2;
      position: sticky;
      top: 16px;
      align-self: start;
      width: 100%;
      border-color: rgba(159,179,255,.16);
      background:
        radial-gradient(circle at top right, rgba(159,179,255,.08), transparent 18rem),
        rgba(16,18,25,.92);
    }

    .layout.wishlist-view .wishlist .wish-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .layout.wishlist-view .wishlist .family-group + .family-group {
      margin-top: 0;
    }

    .layout.wishlist-view .wishlist .family-group {
      background: rgba(15,17,21,.54);
      border-color: rgba(60,65,75,.88);
    }

    .layout.wishlist-view .wishlist .family-head {
      min-height: 52px;
      padding: 13px 14px;
      font-size: 16px;
      background: linear-gradient(90deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    }

    .layout.wishlist-view .wishlist .family-body {
      padding: 12px;
      gap: 12px;
    }

    .layout.wishlist-view .wishlist .weapon-head {
      padding: 11px 12px;
      font-size: 15px;
    }

    .layout.wishlist-view .wishlist .wish-item {
      grid-template-columns: 92px minmax(0, 1fr) auto;
      gap: 12px;
      padding: 12px;
    }

    .layout.wishlist-view .wishlist .wish-item img {
      width: 88px;
      height: 56px;
    }

    .layout.wishlist-view .wishlist .wish-title {
      font-size: 14px;
    }

    .layout.wishlist-view .search-panel .controls {
      grid-template-columns: 1fr;
      padding: 14px;
      gap: 10px;
    }

    .layout.wishlist-view .search-panel .toolbar {
      padding: 12px 14px;
      gap: 8px;
    }

    /* ===== Loadout (CS2-style slots at the top) ===== */
    .loadout { margin-bottom: 22px; }

    .loadout-head-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .side-tabs {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #0e1118;
    }

    .side-tab {
      min-width: 56px;
      padding: 9px 16px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: .04em;
      transition: background .15s ease, color .15s ease;
    }

    .side-tab:hover { color: var(--text); background: rgba(255,255,255,.04); }
    .side-tab[data-side="T"].active  { color: #ffd9a0; background: rgba(255,190,100,.14); }
    .side-tab[data-side="CT"].active { color: #bcd4ff; background: rgba(120,170,255,.16); }

    .loadout-body {
      display: grid;
      grid-template-columns: minmax(130px, .75fr) repeat(3, minmax(0, 1fr)) minmax(130px, .75fr);
      gap: 14px;
      align-items: start;
      padding: 18px;
    }

    .loadout-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .loadout.collapsed .loadout-body { display: none; }
    .loadout.collapsed .panel-head { border-bottom: 0; }

    .loadout-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .loadout-group-title {
      margin: 0;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .loadout-slots {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slot {
      --rarity: var(--line);
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 108px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(27,31,42,.95), rgba(18,21,29,.97));
      cursor: pointer;
      outline: none;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }

    .slot:hover,
    .slot:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(159,179,255,.5);
    }

    .slot.filled { box-shadow: inset 0 -3px 0 var(--rarity); }

    .slot-label {
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .04em;
      color: var(--soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 22px;
    }

    .slot-art {
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 56px;
      overflow: hidden;
    }

    .slot-art img {
      max-width: 100%;
      max-height: 58px;
      object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.4));
      pointer-events: none;
    }

    .slot-plus {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px dashed #455064;
      border-radius: 50%;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
    }

    .slot:hover .slot-plus { color: var(--accent); border-color: rgba(159,179,255,.6); }

    .slot-name {
      font-size: 11px;
      line-height: 1.25;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .slot.filled .slot-name { color: var(--text); font-weight: 600; }

    .slot-clear {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(15,17,21,.7);
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
    }

    .slot-clear:hover { color: var(--danger); border-color: rgba(255,155,155,.35); }

    /* Skin picker modal */
    body.modal-open { overflow: hidden; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(5,7,10,.72);
      backdrop-filter: blur(4px);
    }

    .modal-dialog {
      position: relative;
      width: min(980px, 100%);
      max-height: min(86vh, 860px);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head h2 { margin: 0 0 3px; font-size: 18px; letter-spacing: -.02em; }
    .modal-head small { color: var(--muted); }

    .modal-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(15,17,21,.4);
    }

    .modal-controls select { width: auto; min-width: 180px; }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--soft);
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
    }

    .check input { width: auto; min-height: 0; }

    .modal-content {
      padding: 16px 18px;
      overflow: auto;
      flex: 1;
    }

    .picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
    }

    .pick {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      text-align: left;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(27,31,42,.95), rgba(18,21,29,.97));
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease;
    }

    .pick:hover { transform: translateY(-1px); border-color: rgba(159,179,255,.5); }
    .pick.selected { border-color: rgba(155,230,187,.55); background: rgba(155,230,187,.08); }

    .pick-art {
      height: 74px;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .pick-art img {
      max-width: 100%;
      max-height: 70px;
      object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.4));
    }

    .pick-name {
      font-size: 12px;
      font-weight: 650;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.5em;
    }

    .pick-meta {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .pick-star { color: var(--accent); font-weight: 750; white-space: nowrap; }

    .modal-foot {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 12px 18px;
      border-top: 1px solid var(--line);
    }

    .modal-foot .toolbar-info { margin-right: auto; }

    @media (max-width: 740px) {
      .loadout-body { grid-template-columns: 1fr; }
      .modal-controls { grid-template-columns: 1fr; }
      .modal-controls select { width: 100%; }
      .modal-foot { flex-wrap: wrap; }
    }

  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">

      </div>

  <script>
    const DATA_URL = "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins.json";
    const STORAGE_KEY = "cs2_skin_wishlist_v1";
    const COLLAPSE_STORAGE_KEY = "cs2_skin_wishlist_collapsed_groups_v1";
    const LAYOUT_STORAGE_KEY = "cs2_skin_wishlist_layout_mode_v1";
    const SAVED_LISTS_STORAGE_KEY = "cs2_skin_wishlist_saved_lists_v1";
    const MAX_PER_WEAPON = 5;
    const MAX_PER_SPECIAL_GROUP = 10;
    const PAGE_SIZE = 80;

    const state = {
      allSkins: [],
      filteredSkins: [],
      wishlist: [],
      collapsedGroups: new Set(),
      visibleCount: PAGE_SIZE,
      filters: { search: "", category: "", weapon: "" }
    };

    const els = {
      layout: document.getElementById("layout"),
      dataDot: document.getElementById("dataDot"),
      dataStatus: document.getElementById("dataStatus"),
      wishCount: document.getElementById("wishCount"),

    let crcTable = null;

    function getCrcTable() {
      if (crcTable) return crcTable;

      crcTable = new Uint32Array(256);

      for (let n = 0; n < 256; n++) {
        let c = n;

        for (let k = 0; k < 8; k++) {
          c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }

        crcTable[n] = c >>> 0;
      }

      return crcTable;
    }

    function crc32(bytes) {
      const table = getCrcTable();
      let crc = 0 ^ -1;

      for (let i = 0; i < bytes.length; i++) {
        crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
      }

      return (crc ^ -1) >>> 0;
    }

    function encodeVarint(value) {
      let n = Number(value) >>> 0;
      const out = [];

      while (n >= 0x80) {
        out.push((n & 0x7F) | 0x80);
        n = n >>> 7;
      }

      out.push(n);
      return out;
    }

    function encodeField(fieldNumber, value) {
      return [
        ...encodeVarint((fieldNumber << 3) | 0),
        ...encodeVarint(value)
      ];
    }

    function floatToUint32(value) {
      const buffer = new ArrayBuffer(4);
      const view = new DataView(buffer);
      view.setFloat32(0, Number(value), true);
      return view.getUint32(0, true);
    }

    function uint32ToBigEndianBytes(value) {
      return [
        (value >>> 24) & 0xFF,
        (value >>> 16) & 0xFF,
        (value >>> 8) & 0xFF,
        value & 0xFF
      ];
    }

    function bytesToHex(bytes) {
      return Array.from(bytes)
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function getDefIndex(item) {
      return DEF_INDEX_BY_WEAPON[item.weapon] || null;
    }

    function isVanillaKnife(item) {
      return item.category === "Knives" && (
        item.paintIndex === null ||
        item.paintIndex === undefined ||
        item.paintIndex === "" ||
        Number(item.paintIndex) === 0
      );
    }

    function getPaintIndex(item) {
      const value = Number(item.paintIndex);

      if (Number.isFinite(value) && value > 0) {
        return Math.trunc(value);
      }

      if (isVanillaKnife(item)) {
        return 0;
      }

      return null;
    }

    function getRarityValue(item) {
      if (RARITY_VALUE_BY_NAME[item.rarity]) return RARITY_VALUE_BY_NAME[item.rarity];
      if (item.category === "Knives" || item.category === "Gloves") return 6;
      return 4;
    }

    function getDefaultWear(item) {
      if (isVanillaKnife(item)) {
        return 0;
      }

      const min = Number(item.minFloat);
      const max = Number(item.maxFloat);

      let wear = Number.isFinite(min) ? min : 0;

      if (wear <= 0) wear = 0.001;
      if (Number.isFinite(max) && wear > max) wear = max;
      if (Number.isFinite(min) && wear < min) wear = min;

      return Number(wear.toFixed(6));
    }

    function canGenerateInspect(item) {
      const defindex = getDefIndex(item);
      const paintindex = getPaintIndex(item);

      return Boolean(defindex !== null && defindex !== undefined && paintindex !== null && paintindex !== undefined);
    }

    function generateInspectHex(item) {
      const defindex = getDefIndex(item);
      const paintindex = getPaintIndex(item);
      const rarity = getRarityValue(item);
      const quality = 4;
      const paintwear = floatToUint32(getDefaultWear(item));
      const paintseed = 0;

      const proto = [
        ...encodeField(3, defindex),
        ...encodeField(4, paintindex),
        ...encodeField(5, rarity),
        ...encodeField(6, quality),
        ...encodeField(7, paintwear),
        ...encodeField(8, paintseed)
      ];

      const buffer = new Uint8Array(1 + proto.length);
      buffer[0] = 0;
      buffer.set(proto, 1);

      const crc = crc32(buffer);
      const xoredCrc = (((crc & 0xFFFF) ^ Math.imul(proto.length, crc)) >>> 0);
      const finalBuffer = new Uint8Array(buffer.length + 4);

      finalBuffer.set(buffer);
      finalBuffer.set(uint32ToBigEndianBytes(xoredCrc), buffer.length);

      return bytesToHex(finalBuffer);
    }

    function generateInspectLink(item) {
      return `steam://rungame/730/76561202255233023/+csgo_econ_action_preview%20${generateInspectHex(item)}`;

    function generateConsoleCommand(item) {
      const defindex = getDefIndex(item);
      const paintindex = getPaintIndex(item);
      const wear = getDefaultWear(item);

      if (defindex === null || defindex === undefined || paintindex === null || paintindex === undefined) return "";

      if (item.category === "Gloves") {
        return `!gengl ${defindex} ${paintindex} 0 ${wear}`;

    function copyText(value) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(value);

      const textarea = document.createElement("textarea");
      textarea.value = value;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        return Promise.resolve();
      } catch {
        return Promise.reject();
      } finally {
        textarea.remove();
      }
    }

    function parseWeaponFilter(value) {
      if (!value) return { type: "", name: "" };
      const separatorIndex = value.indexOf(":");
      if (separatorIndex === -1) return { type: "weapon", name: value };
      return {
        type: value.slice(0, separatorIndex),
        name: value.slice(separatorIndex + 1)
      };
    }

      if (item.category === "Equipment") {
        return item.weapon === "Zeus x27";

      return item.category !== "Equipment";

    function applyFilters() {
      const q = state.filters.search.trim().toLowerCase();
      const selected = parseWeaponFilter(state.filters.weapon);

      state.filteredSkins = state.allSkins.filter(item => {
        if (!isAllowedSkin(item)) return false;

        const matchesSearch = !q || [
          item.name,
          item.weapon,
          item.category,
          item.rarity
        ].join(" ").toLowerCase().includes(q);

        let matchesWeapon = true;

        if (selected.type === "weapon") {
          matchesWeapon = item.weapon === selected.name;
        }

        if (selected.type === "category") {
          matchesWeapon = item.category === selected.name;
        }

        return matchesSearch && matchesWeapon;
      });

      renderSkins();
    }

        const groupLimit = getWishlistGroupLimit(groupKey);
        const groupFull = getWishlistGroupCount(groupKey) >= groupLimit;
        const disabled = added || (!added && groupFull);
        const btnText = added ? "В wishlist" : groupFull ? "Лимит" : "Добавить";

    function getWishlistFamilyKey(item) {
      if (item.category === "Gloves") return "Gloves";
      if (item.category === "Knives") return "Knives";
      if (item.category === "Rifles") return "Rifles";
      if (item.category === "Sniper Rifles") return "Snipers";
      if (item.category === "SMGs") return "SMG";
      if (item.category === "Pistols") return "Pistols";
      if (item.category === "Heavy") return "Heavy";
      if (item.weapon === "Zeus x27") return "Zeus x27";
      return item.category || "Other";
    }

    function getCollapseKey(type, key) { return `${type}:${key}`; }

    function groupWishlist() {
      const families = new Map();

      for (const item of state.wishlist) {
        const familyKey = getWishlistFamilyKey(item);
        const groupKey = getWishlistGroupKey(item);
        const standalone = familyKey === "Gloves" || familyKey === "Knives" || familyKey === "Zeus x27";

        if (!families.has(familyKey)) {
          families.set(familyKey, { key: familyKey, label: familyKey, standalone, items: [], children: new Map() });
        }

        const family = families.get(familyKey);

        if (standalone) {
          family.items.push(item);
        } else {
          if (!family.children.has(groupKey)) family.children.set(groupKey, { key: groupKey, label: groupKey, items: [] });
          family.children.get(groupKey).items.push(item);
        }
      }

      const order = ["Gloves", "Knives", "Rifles", "Snipers", "SMG", "Pistols", "Heavy", "Zeus x27", "Other"];

      return [...families.values()].sort((a, b) => {
        const ai = order.indexOf(a.key), bi = order.indexOf(b.key);
        if (ai !== -1 || bi !== -1) {
          if (ai === -1) return 1;
          if (bi === -1) return -1;
          return ai - bi;
        }
        return a.label.localeCompare(b.label);
      }).map(family => ({ ...family, children: [...family.children.values()].sort((a, b) => a.label.localeCompare(b.label)) }));
    }

    function countActiveWishlistItems(items) {
      return items.filter(item => !isOwned(item)).length;
    }

    function sortWishlistItems(items) {
      return [...items].sort((a, b) => Number(isOwned(a)) - Number(isOwned(b)));
    }

    function getGroupItemCount(group) {
      if (group.standalone) return countActiveWishlistItems(group.items);
      return group.children.reduce((sum, child) => sum + countActiveWishlistItems(child.items), 0);
    }

    function toggleWishlistGroup(key) {
      if (state.collapsedGroups.has(key)) state.collapsedGroups.delete(key);
      else state.collapsedGroups.add(key);
      saveCollapsedGroups();
      renderWishlist();
    }

    function collapseAllWishlistGroups() {
      for (const family of groupWishlist()) {
        state.collapsedGroups.add(getCollapseKey("family", family.key));
        if (!family.standalone) for (const child of family.children) state.collapsedGroups.add(getCollapseKey("weapon", child.key));
      }
      saveCollapsedGroups();
      renderWishlist();
    }

    function encodeSharePayload(payload) {
      const json = JSON.stringify(payload);
      const bytes = new TextEncoder().encode(json);
      let binary = "";

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return "CS2W1." + btoa(binary)
        .replaceAll("+", "-")
        .replaceAll("/", "_")
        .replaceAll("=", "");
    }

    function decodeShareCode(code) {
      let value = String(code || "").trim();

      if (!value) {
        throw new Error("Empty code");
      }

      if (value.startsWith("CS2W1.")) {
        value = value.slice("CS2W1.".length);
      }

      value = value.replaceAll("-", "+").replaceAll("_", "/");

      while (value.length % 4) {
        value += "=";
      }

      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function buildWishlistFromEntries(entries) {
      const byId = new Map(state.allSkins.map(item => [item.id, item]));
      const next = [];

      for (const entry of entries) {
        const id = typeof entry === "string" ? entry : entry?.id;
        const owned = typeof entry === "object" && entry ? Boolean(entry.owned) : false;
        const skin = byId.get(id);

        if (!skin) continue;
        if (next.some(item => item.id === skin.id)) continue;

        const groupKey = getWishlistGroupKey(skin);
        const groupLimit = getWishlistGroupLimit(groupKey);
        const groupCount = next.filter(item => getWishlistGroupKey(item) === groupKey && !isOwned(item)).length;

        if (!owned && groupCount >= groupLimit) continue;

        next.push({ ...skin, owned });
      }

      return next;
    }

    function generateWishlistCode() {
      if (!state.wishlist.length) {
        showToast("Wishlist пустой");
        return;
      }

      const payload = {
        app: "CS2 Skin Wishlist",
        version: 2,
        createdAt: new Date().toISOString(),
        ids: state.wishlist.map(item => item.id),
        items: serializeWishlistItems()
      };

      const code = encodeSharePayload(payload);
      els.shareCodeInput.value = code;

      copyText(code)
        .then(() => showToast("Код создан и скопирован"))
        .catch(() => showToast("Код создан"));
    }

    function copyWishlistCode() {
      const code = els.shareCodeInput.value.trim();

      if (!code) {
        showToast("Сначала сгенерируй или вставь код");
        return;
      }

      copyText(code)
        .then(() => showToast("Код скопирован"))
        .catch(() => alert("Не удалось скопировать код. Скопируй вручную."));
    }

    function loadWishlistCode() {
      const code = els.shareCodeInput.value.trim();

      if (!code) {
        showToast("Вставь код списка");
        return;
      }

      let payload;

      try {
        payload = decodeShareCode(code);
      } catch {
        alert("Код списка не распознан.");
        return;
      }

      const entries = Array.isArray(payload.items)
        ? payload.items
        : Array.isArray(payload.ids)
          ? payload.ids
          : [];

      if (!entries.length) {
        alert("В коде нет скинов.");
        return;
      }

      if (!state.allSkins.length) {
        alert("База скинов ещё не загрузилась. Подожди пару секунд и попробуй снова.");
        return;
      }

      const next = buildWishlistFromEntries(entries);

      if (!next.length) {
        alert("Не удалось найти скины из этого кода в текущей базе.");
        return;
      }

      const shouldReplace = confirm(
        `Загрузить ${next.length} скинов из кода?\\n\\nOK — заменить текущий wishlist.\\nCancel — отменить.`
      );

      if (!shouldReplace) return;

      state.wishlist = next;
      saveWishlist();
      renderWishlist();
      renderSkins();
      showToast("Wishlist загружен из кода");
    }

    function serializeWishlistItems() {
      return state.wishlist.map(item => ({
        id: item.id,
        owned: Boolean(item.owned)
      }));
    }

    function loadSavedLists() {
      try {
        const stored = localStorage.getItem(SAVED_LISTS_STORAGE_KEY);
        const parsed = stored ? JSON.parse(stored) : {};
        return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveSavedLists(lists) {
      localStorage.setItem(SAVED_LISTS_STORAGE_KEY, JSON.stringify(lists));
    }

    function refreshSavedListSelect(selectedName = "") {
      if (!els.savedListSelect) return;

      const lists = loadSavedLists();
      const names = Object.keys(lists).sort((a, b) => a.localeCompare(b));

      els.savedListSelect.innerHTML = `<option value="">Сохранённые списки</option>` + names
        .map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)} · ${lists[name].items?.length || 0}</option>`)
        .join("");

      if (selectedName && lists[selectedName]) {
        els.savedListSelect.value = selectedName;
      }
    }

    function saveCurrentListNamed() {
      if (!state.wishlist.length) {
        showToast("Wishlist пустой");
        return;
      }

      const name = prompt("Название списка:", "");
      if (!name) return;

      const cleanName = name.trim();
      if (!cleanName) return;

      const lists = loadSavedLists();

      lists[cleanName] = {
        name: cleanName,
        updatedAt: new Date().toISOString(),
        items: serializeWishlistItems()
      };

      saveSavedLists(lists);
      refreshSavedListSelect(cleanName);
      showToast(`Список сохранён: ${cleanName}`);
    }

    function startNewWishlist() {
      if (state.wishlist.length) {
        const ok = confirm("Создать новый пустой wishlist? Текущий список останется только если ты заранее сохранил его.");
        if (!ok) return;
      }

      state.wishlist = [];
      saveWishlist();
      renderWishlist();
      renderSkins();
      showToast("Создан новый пустой wishlist");
    }

    function loadSavedWishlist() {
      const name = els.savedListSelect?.value || "";
      if (!name) {
        showToast("Выбери сохранённый список");
        return;
      }

      if (!state.allSkins.length) {
        alert("База скинов ещё не загрузилась. Подожди пару секунд и попробуй снова.");
        return;
      }

      const lists = loadSavedLists();
      const saved = lists[name];

      if (!saved || !Array.isArray(saved.items)) {
        alert("Не удалось открыть этот список.");
        refreshSavedListSelect();
        return;
      }

      const next = buildWishlistFromEntries(saved.items);

      state.wishlist = next;
      saveWishlist();
      renderWishlist();
      renderSkins();
      showToast(`Открыт список: ${name}`);
    }

    function deleteSavedWishlist() {
      const name = els.savedListSelect?.value || "";
      if (!name) {
        showToast("Выбери сохранённый список");
        return;
      }

      const ok = confirm(`Удалить сохранённый список «${name}»? Текущий wishlist на странице не будет очищен.`);
      if (!ok) return;

      const lists = loadSavedLists();
      delete lists[name];

      saveSavedLists(lists);
      refreshSavedListSelect();
      showToast("Сохранённый список удалён");
    }

    function exportWishlist() {
      const payload = { app: "CS2 Skin Wishlist", version: 1, exportedAt: new Date().toISOString(), maxPerWeapon: MAX_PER_WEAPON, maxPerSpecialGroup: MAX_PER_SPECIAL_GROUP, items: state.wishlist };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cs2-skin-wishlist.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importWishlist(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const items = Array.isArray(parsed) ? parsed : parsed.items;
          if (!Array.isArray(items)) throw new Error("Invalid format");
          const next = [];
          for (const item of items) {
            const normalized = normalizeSkin(item);
            if (next.some(x => x.id === normalized.id)) continue;
            const groupKey = getWishlistGroupKey(normalized);
            if (!isOwned(normalized) && next.filter(x => getWishlistGroupKey(x) === groupKey && !isOwned(x)).length >= getWishlistGroupLimit(groupKey)) continue;
            next.push(normalized);
          }
          state.wishlist = next;
          saveWishlist();
          renderWishlist();
          renderSkins();
          showToast("Import готов");
        } catch { alert("Не удалось импортировать JSON."); }
      };
      reader.readAsText(file);
      if (els.importInput) els.importInput.value = "";
    }

    function bindEvents() {

      els.weaponSelect.addEventListener("change", () => { state.filters.weapon = els.weaponSelect.value; state.visibleCount = PAGE_SIZE; applyFilters(); });

      });

      if (els.expandAllBtn) els.expandAllBtn.addEventListener("click", expandAllWishlistGroups);
      if (els.generateCodeBtn) els.generateCodeBtn.addEventListener("click", generateWishlistCode);
      if (els.copyCodeBtn) els.copyCodeBtn.addEventListener("click", copyWishlistCode);
      if (els.loadCodeBtn) els.loadCodeBtn.addEventListener("click", loadWishlistCode);
      if (els.clearWishlistBtn) els.clearWishlistBtn.addEventListener("click", clearWishlist);
      if (els.saveListBtn) els.saveListBtn.addEventListener("click", saveCurrentListNamed);
      if (els.newListBtn) els.newListBtn.addEventListener("click", startNewWishlist);
      if (els.loadSavedListBtn) els.loadSavedListBtn.addEventListener("click", loadSavedWishlist);
      if (els.deleteSavedListBtn) els.deleteSavedListBtn.addEventListener("click", deleteSavedWishlist);
      if (els.viewToggleBtn) els.viewToggleBtn.addEventListener("click", toggleLayoutMode);
    }

    async function loadData() {
      try {
        const res = await fetch(DATA_URL, { cache: "force-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();
        state.allSkins = raw
          .map(normalizeSkin)
          .filter(item => item.id && item.image && item.weapon !== "Unknown")
          .filter(isAllowedSkin)
          .sort((a, b) => a.category.localeCompare(b.category) || a.weapon.localeCompare(b.weapon) || a.name.localeCompare(b.name));
        state.filteredSkins = [...state.allSkins];
        els.dataDot.classList.add("ok");
        els.dataStatus.textContent = `${state.allSkins.length} skins loaded`;
        populateFilters();
        applyFilters();
      } catch (err) {
        els.dataDot.classList.add("bad");
        els.dataStatus.textContent = "Ошибка загрузки базы";
        if (els.resultInfo) els.resultInfo.textContent = "База не загрузилась";
        els.emptySearch.classList.remove("hidden");
        els.emptySearch.textContent = "Не удалось загрузить skins.json. Проверь интернет или CORS.";
        console.error(err);
      }
    }

    /* ===== Loadout (CS2-style) ===== */
    const LOADOUT_STORAGE_KEY = "cs2_skin_wishlist_loadout_v1";
    const LOADOUT_UI_KEY = "cs2_skin_wishlist_loadout_ui_v1";
    const PICKER_PAGE_SIZE = 60;

    // Слот может объединять несколько оружий (как в CS2): в окне выбора появится фильтр по оружию.
    const weaponSlot = (...names) => ({ id: names.join("|"), label: names.join(" / "), weapons: names });
    const knifeSlot = { id: "Knife", label: "Knife", category: "Knives" };
    const glovesSlot = { id: "Gloves", label: "Gloves", category: "Gloves" };

    // 5 колонок, в каждой не больше 5 слотов: Knife | Pistols | Mid-tier | Rifles | Gloves
    const LOADOUT_LAYOUT = {
      T: [
        [{ title: "Knife", slots: [knifeSlot] }],
        [{ title: "Pistols", slots: [
          { ...weaponSlot("Glock-18"), locked: true },
          weaponSlot("P250"),
          weaponSlot("Tec-9", "CZ75-Auto"),
          weaponSlot("Desert Eagle", "R8 Revolver"),
          weaponSlot("Dual Berettas")
        ] }],
        [{ title: "Mid-tier", slots: [
          weaponSlot("MAC-10"),
          weaponSlot("MP7", "MP5-SD"),
          weaponSlot("UMP-45", "P90", "PP-Bizon"),
          weaponSlot("Nova", "XM1014", "Sawed-Off"),
          weaponSlot("M249", "Negev")
        ] }],
        [{ title: "Rifles", slots: [
          weaponSlot("AK-47"),
          weaponSlot("Galil AR", "SG 553"),
          weaponSlot("AWP"),
          weaponSlot("SSG 08"),
          weaponSlot("G3SG1")
        ] }],
        [{ title: "Gloves", slots: [glovesSlot] }]
      ],
      CT: [
        [{ title: "Knife", slots: [knifeSlot] }],
        [{ title: "Pistols", slots: [
          { ...weaponSlot("USP-S", "P2000"), locked: true },
          weaponSlot("P250"),
          weaponSlot("Five-SeveN", "CZ75-Auto"),
          weaponSlot("Desert Eagle", "R8 Revolver"),
          weaponSlot("Dual Berettas")
        ] }],
        [{ title: "Mid-tier", slots: [
          weaponSlot("MP9"),
          weaponSlot("MP7", "MP5-SD"),
          weaponSlot("UMP-45", "P90", "PP-Bizon"),
          weaponSlot("Nova", "XM1014", "MAG-7"),
          weaponSlot("M249", "Negev")
        ] }],
        [{ title: "Rifles", slots: [
          weaponSlot("M4A4", "M4A1-S"),
          weaponSlot("FAMAS", "AUG"),
          weaponSlot("AWP"),
          weaponSlot("SSG 08"),
          weaponSlot("SCAR-20")
        ] }],
        [{ title: "Gloves", slots: [glovesSlot] }]
      ]
    };

    // Нейтральные названия слотов, пока скин не выбран.
    const LOADOUT_NEUTRAL_LABELS = { "Pistols": "Pistol", "Mid-tier": "Mid-tier", "Rifles": "Rifle" };

    // Любой слот колонки принимает любое оружие этой колонки (для своей стороны).
    // Исключение: стартовый пистолет (locked) — только Glock-18 / USP-S / P2000.
    for (const side of Object.keys(LOADOUT_LAYOUT)) {
      for (const column of LOADOUT_LAYOUT[side]) {
        for (const group of column) {
          const free = group.slots.filter(slot => slot.weapons && !slot.locked);
          if (free.length < 2) continue;
          const pool = [...new Set(free.flatMap(slot => slot.weapons))];
          free.forEach(slot => {
            slot.weapons = pool;
            slot.neutral = LOADOUT_NEUTRAL_LABELS[group.title] || slot.label;
          });
        }
      }
    }

    const loadoutState = { equipped: {}, side: "CT", collapsed: false, picker: null };

    function loadLoadout() {
      try {
        const parsed = JSON.parse(localStorage.getItem(LOADOUT_STORAGE_KEY) || "{}");
        loadoutState.equipped = parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
      } catch { loadoutState.equipped = {}; }

      try {
        const ui = JSON.parse(localStorage.getItem(LOADOUT_UI_KEY) || "{}");
        loadoutState.side = ui.side === "T" ? "T" : "CT";
        loadoutState.collapsed = Boolean(ui.collapsed);
      } catch {}
    }

    function saveLoadout() {
      localStorage.setItem(LOADOUT_STORAGE_KEY, JSON.stringify(loadoutState.equipped));
    }

    function saveLoadoutUi() {
      localStorage.setItem(LOADOUT_UI_KEY, JSON.stringify({ side: loadoutState.side, collapsed: loadoutState.collapsed }));
    }

    function loadoutSlotKey(side, slot) { return `${side}:${slot.id}`; }

    function findLoadoutSlot(slotId) {
      for (const column of LOADOUT_LAYOUT[loadoutState.side]) {
        for (const group of column) {
          const slot = group.slots.find(s => s.id === slotId);
          if (slot) return slot;
        }
      }
      return null;
    }

    // Название оружия выбранного скина (для старых записей без поля weapon берём из названия «AK-47 | Redline»).
    function getEquippedWeaponName(eq) {
      if (eq.weapon) return eq.weapon;
      return String(eq.name || "").split(" | ")[0].replace(/^★\s*/, "").replace(/^StatTrak™\s*/, "").trim();
    }

    function renderLoadoutSlot(slot) {
      const eq = loadoutState.equipped[loadoutSlotKey(loadoutState.side, slot)];
      const style = eq ? ` style="--rarity:${escapeHtml(eq.rarityColor || "#8b93a3")}"` : "";

      return `
        <div class="slot ${eq ? "filled" : ""}" role="button" tabindex="0" data-slot="${escapeHtml(slot.id)}"${style}>
          <div class="slot-label">${escapeHtml(eq ? getEquippedWeaponName(eq) : (slot.neutral || slot.label))}</div>
          <div class="slot-art">${eq && eq.image
            ? `<img loading="lazy" src="${escapeHtml(eq.image)}" alt="${escapeHtml(eq.name || "")}">`
            : `<span class="slot-plus">+</span>`}</div>
          <div class="slot-name">${eq ? escapeHtml(eq.name || "") : "Не выбрано"}</div>
          ${eq ? `<button class="slot-clear" type="button" data-clear="${escapeHtml(slot.id)}" title="Снять скин" aria-label="Снять скин">×</button>` : ""}
        </div>`;
    }

    function renderLoadout() {
      const panel = document.getElementById("loadoutPanel");
      const body = document.getElementById("loadoutBody");
      if (!panel || !body) return;

      const columns = LOADOUT_LAYOUT[loadoutState.side];

      panel.classList.toggle("collapsed", loadoutState.collapsed);
      document.getElementById("loadoutCollapseBtn").textContent = loadoutState.collapsed ? "Развернуть" : "Свернуть";

      document.querySelectorAll(".side-tab").forEach(btn => {
        const active = btn.dataset.side === loadoutState.side;
        btn.classList.toggle("active", active);
        btn.setAttribute("aria-selected", String(active));
      });

      const validKeys = new Set();
      for (const side of Object.keys(LOADOUT_LAYOUT)) {
        for (const column of LOADOUT_LAYOUT[side]) {
          for (const group of column) group.slots.forEach(slot => validKeys.add(loadoutSlotKey(side, slot)));
        }
      }
      const total = Object.keys(loadoutState.equipped).filter(key => validKeys.has(key)).length;
      document.getElementById("loadoutCount").textContent = String(total);

      body.innerHTML = columns.map(column => `
        <div class="loadout-col">${column.map(group => `
          <section class="loadout-group">
            <h3 class="loadout-group-title">${escapeHtml(group.title)}</h3>
            <div class="loadout-slots">${group.slots.map(renderLoadoutSlot).join("")}</div>
          </section>`).join("")}
        </div>`).join("");
    }

    function unequipSlot(slotId) {
      const slot = findLoadoutSlot(slotId);
      if (!slot) return;
      delete loadoutState.equipped[loadoutSlotKey(loadoutState.side, slot)];
      saveLoadout();
      renderLoadout();
      showToast("Скин снят");
    }

    function clearLoadout() {
      if (!Object.keys(loadoutState.equipped).length) return;
      if (!confirm("Очистить весь loadout (T и CT)?")) return;
      loadoutState.equipped = {};
      saveLoadout();
      renderLoadout();
      showToast("Loadout очищен");
    }

    /* --- picker --- */
    function getPickerCandidates() {
      const p = loadoutState.picker;
      if (!p) return [];
      const q = p.search.trim().toLowerCase();

      return state.allSkins
        .filter(item => {
          if (p.slot.weapons ? !p.slot.weapons.includes(item.weapon) : item.category !== p.slot.category) return false;
          if (p.weapon && item.weapon !== p.weapon) return false;
          if (p.onlyWishlist && !isInWishlist(item.id)) return false;
          if (q && !item.name.toLowerCase().includes(q)) return false;
          return true;
        })
        .sort((a, b) => Number(isInWishlist(b.id)) - Number(isInWishlist(a.id)));
    }

    function renderPicker() {
      const p = loadoutState.picker;
      if (!p) return;

      const grid = document.getElementById("pickerGrid");
      const empty = document.getElementById("pickerEmpty");
      const info = document.getElementById("pickerInfo");
      const moreBtn = document.getElementById("pickerMoreBtn");
      const equippedId = loadoutState.equipped[p.key]?.id;

      if (!state.allSkins.length) {
        grid.innerHTML = "";
        empty.textContent = "База скинов ещё загружается…";
        empty.classList.remove("hidden");
        info.textContent = "";
        moreBtn.disabled = true;
        return;
      }

      empty.textContent = "Ничего не найдено.";

      const all = getPickerCandidates();
      const visible = all.slice(0, p.visible);

      grid.innerHTML = visible.map(item => `
        <button class="pick ${item.id === equippedId ? "selected" : ""}" type="button" data-pick="${escapeHtml(item.id)}" style="border-bottom:3px solid ${escapeHtml(item.rarityColor)}">
          <div class="pick-art"><img loading="lazy" src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}"></div>
          <div class="pick-name">${escapeHtml(item.name)}</div>
          <div class="pick-meta">
            <span>${escapeHtml(item.rarity || "—")}</span>
            ${isInWishlist(item.id) ? `<span class="pick-star">★ wishlist</span>` : ""}
          </div>
        </button>`).join("");

      empty.classList.toggle("hidden", all.length !== 0);
      info.textContent = `${all.length} найдено · показано ${visible.length}`;
      moreBtn.disabled = visible.length >= all.length;
    }

    function openPicker(slotId) {
      const slot = findLoadoutSlot(slotId);
      if (!slot) return;

      const key = loadoutSlotKey(loadoutState.side, slot);
      loadoutState.picker = { slot, key, search: "", weapon: "", onlyWishlist: false, visible: PICKER_PAGE_SIZE };

      document.getElementById("pickerTitle").textContent = slot.neutral || slot.label;
      document.getElementById("pickerSubtitle").textContent = `${loadoutState.side} · выбери скин для слота`;
      document.getElementById("pickerSearch").value = "";
      document.getElementById("pickerOnlyWishlist").checked = false;
      document.getElementById("pickerClearBtn").classList.toggle("hidden", !loadoutState.equipped[key]);

      const weaponSelect = document.getElementById("pickerWeaponSelect");

      if (slot.category || (slot.weapons && slot.weapons.length > 1)) {
        const weapons = slot.weapons
          ? [...slot.weapons].sort((a, b) => a.localeCompare(b))
          : [...new Set(state.allSkins.filter(s => s.category === slot.category).map(s => s.weapon))].sort((a, b) => a.localeCompare(b));
        weaponSelect.innerHTML = `<option value="">Всё оружие</option>` +
          weapons.map(w => `<option value="${escapeHtml(w)}">${escapeHtml(w)}</option>`).join("");
        weaponSelect.classList.remove("hidden");
      } else {
        weaponSelect.innerHTML = "";
        weaponSelect.classList.add("hidden");
      }

      document.getElementById("pickerModal").classList.remove("hidden");
      document.body.classList.add("modal-open");
      renderPicker();
      document.getElementById("pickerSearch").focus();
    }

    function closePicker() {
      loadoutState.picker = null;
      document.getElementById("pickerModal").classList.add("hidden");
      document.body.classList.remove("modal-open");
    }

    function equipSkin(id) {
      const p = loadoutState.picker;
      const skin = state.allSkins.find(item => item.id === id);
      if (!p || !skin) return;

      loadoutState.equipped[p.key] = {
        id: skin.id,
        name: skin.name,
        weapon: skin.weapon,
        image: skin.image,
        rarity: skin.rarity,
        rarityColor: skin.rarityColor
      };

      saveLoadout();
      renderLoadout();
      closePicker();
      showToast(`Экипировано: ${skin.name}`);
    }

    function initLoadout() {
      loadLoadout();
      renderLoadout();

      document.querySelectorAll(".side-tab").forEach(btn => btn.addEventListener("click", () => {
        loadoutState.side = btn.dataset.side === "CT" ? "CT" : "T";
        saveLoadoutUi();
        renderLoadout();
      }));

      document.getElementById("loadoutCollapseBtn").addEventListener("click", () => {
        loadoutState.collapsed = !loadoutState.collapsed;
        saveLoadoutUi();
        renderLoadout();
      });

      document.getElementById("loadoutClearBtn").addEventListener("click", clearLoadout);

      const body = document.getElementById("loadoutBody");

      body.addEventListener("click", event => {
        const clear = event.target.closest("[data-clear]");
        if (clear) {
          event.stopPropagation();
          unequipSlot(clear.dataset.clear);
          return;
        }

        const slot = event.target.closest("[data-slot]");
        if (slot) openPicker(slot.dataset.slot);
      });

      body.addEventListener("keydown", event => {
        if (event.key !== "Enter" && event.key !== " ") return;
        if (event.target.closest("[data-clear]")) return;
        const slot = event.target.closest("[data-slot]");
        if (!slot) return;
        event.preventDefault();
        openPicker(slot.dataset.slot);
      });

      document.getElementById("pickerCloseBtn").addEventListener("click", closePicker);
      document.getElementById("pickerBackdrop").addEventListener("click", closePicker);

      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && loadoutState.picker) closePicker();
      });

      document.getElementById("pickerSearch").addEventListener("input", event => {
        if (!loadoutState.picker) return;
        loadoutState.picker.search = event.target.value;
        loadoutState.picker.visible = PICKER_PAGE_SIZE;
        renderPicker();
      });

      document.getElementById("pickerWeaponSelect").addEventListener("change", event => {
        if (!loadoutState.picker) return;
        loadoutState.picker.weapon = event.target.value;
        loadoutState.picker.visible = PICKER_PAGE_SIZE;
        renderPicker();
      });

      document.getElementById("pickerOnlyWishlist").addEventListener("change", event => {
        if (!loadoutState.picker) return;
        loadoutState.picker.onlyWishlist = event.target.checked;
        loadoutState.picker.visible = PICKER_PAGE_SIZE;
        renderPicker();
      });

      document.getElementById("pickerMoreBtn").addEventListener("click", () => {
        if (!loadoutState.picker) return;
        loadoutState.picker.visible += PICKER_PAGE_SIZE;
        renderPicker();
      });

      document.getElementById("pickerClearBtn").addEventListener("click", () => {
        const p = loadoutState.picker;
        if (!p) return;
        delete loadoutState.equipped[p.key];
        saveLoadout();
        renderLoadout();
        closePicker();
        showToast("Скин снят");
      });

      document.getElementById("pickerGrid").addEventListener("click", event => {
        const pick = event.target.closest("[data-pick]");
        if (pick) equipSkin(pick.dataset.pick);
      });
    }

    loadWishlist();
    loadCollapsedGroups();
    bindEvents();
    loadLayoutMode();
    refreshSavedListSelect();
    renderWishlist();
    initLoadout();
    loadData();
  </script>
</body>
</html>
