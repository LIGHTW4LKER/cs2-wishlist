<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CS2 Skin Wishlist</title>
  <meta name="description" content="Minimal local CS2 skin wishlist. No login, no tracking, wishlist is saved in localStorage." />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #151821;
      --panel-2: #1b1f2a;
      --line: #2d3442;
      --text: #e8eaf0;
      --muted: #8b93a3;
      --soft: #c7ccd6;
      --accent: #9fb3ff;
      --danger: #ff9b9b;
      --ok: #9be6bb;
      --shadow: 0 22px 80px rgba(0,0,0,.32);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(159,179,255,.10), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(155,230,187,.06), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .app {
      width: min(1480px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 56px);
      letter-spacing: -.05em;
      line-height: .95;
    }

    .brand p {
      max-width: 780px;
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .status {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-end;
      color: var(--muted);
      font-size: 14px;
    }

    .pill {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(21,24,33,.76);
      color: var(--soft);
      white-space: nowrap;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: var(--ok); }
    .dot.bad { background: var(--danger); }


    .view-toggle-btn {
      width: 100%;
      white-space: nowrap;
    }

    .search-panel {
      min-width: 0;
    }

    .layout.wishlist-view .wishlist {
      order: 1;
      position: static;
      width: 100%;
    }

    .layout.wishlist-view .search-panel {
      order: 2;
      position: sticky;
      top: 16px;
      align-self: start;
      width: 100%;
    }

    .layout.wishlist-view .search-panel .controls {
      grid-template-columns: 1fr;
    }

    .layout.wishlist-view .search-panel .toolbar {
      align-items: center;
    }

    .layout.wishlist-view .search-panel .toolbar-info {
      width: 100%;
      min-height: 0;
      padding-top: 2px;
    }

    .layout.wishlist-view .search-panel .grid {
      grid-template-columns: 1fr;
    }

    .layout.wishlist-view .search-panel .content {
      max-height: calc(100vh - 260px);
      overflow: auto;
    }

    .layout.wishlist-view .search-panel .card {
      min-height: 236px;
    }

    .layout.wishlist-view .wishlist .wish-list {
      gap: 14px;
    }

    @media (max-width: 1050px) {
      .layout.wishlist-view .search-panel {
        position: static;
      }

      .layout.wishlist-view .search-panel .content {
        max-height: none;
        overflow: visible;
      }
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 22px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      background: rgba(21, 24, 33, .82);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .panel-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
    }

    .panel-head h2 { margin: 0; font-size: 18px; letter-spacing: -.02em; }
    .panel-head small { color: var(--muted); }

    .controls {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 10px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(15,17,21,.4);
    }

    .field label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    input, select, textarea {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #0e1118;
      color: var(--text);
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(159,179,255,.65);
      box-shadow: 0 0 0 3px rgba(159,179,255,.12);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .btn {
      border: 1px solid var(--line);
      color: var(--text);
      background: #11141c;
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
    }

    .btn:hover { background: #181c26; border-color: #455064; transform: translateY(-1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn.primary { background: rgba(159,179,255,.13); border-color: rgba(159,179,255,.32); }
    .btn.danger { color: #ffd0d0; background: rgba(255,155,155,.08); border-color: rgba(255,155,155,.24); }

    .content { padding: 18px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }

    .card {
      min-height: 252px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(27,31,42,.95), rgba(18,21,29,.95));
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .skin-img-wrap {
      height: 132px;
      display: grid;
      place-items: center;
      padding: 12px;
      background: linear-gradient(135deg, rgba(255,255,255,.045), transparent), rgba(255,255,255,.02);
      border-bottom: 1px solid var(--line);
    }

    .skin-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 14px 20px rgba(0,0,0,.45));
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .skin-name { font-size: 14px; line-height: 1.25; font-weight: 650; }
    .meta { color: var(--muted); font-size: 12px; line-height: 1.35; }

    .rarity {
      width: fit-content;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid currentColor;
      font-size: 11px;
      opacity: .92;
    }

    .card-actions { margin-top: auto; display: flex; gap: 8px; align-items: center; }
    .card-actions .btn { width: 100%; padding: 8px 10px; font-size: 13px; }

    .empty {
      padding: 38px 18px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 16px;
    }

    .wishlist { position: sticky; top: 16px; }
    .wish-list { display: flex; flex-direction: column; gap: 12px; }

    .weapon-group {
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(15,17,21,.45);
    }

    .weapon-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      color: var(--soft);
      font-weight: 700;
    }

    .weapon-head span:last-child { color: var(--muted); font-weight: 500; font-size: 12px; }


    .count-partial,
    .count-complete {
      display: inline-block;
      margin-left: .35em;
    }

    .weapon-head {
      width: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      font: inherit;
      text-align: left;
    }

    .weapon-head:hover {
      background: rgba(255,255,255,.025);
    }

    .weapon-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .collapse-icon {
      width: 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .wish-items {
      display: block;
    }

    .weapon-group.collapsed .wish-items {
      display: none;
    }

    .weapon-group.collapsed .weapon-head {
      border-bottom: 0;
    }

    .wish-item {
      display: grid;
      grid-template-columns: 74px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(45,52,66,.7);
    }


    .wish-item.owned {
      background: rgba(155, 230, 187, .075);
    }

    .wish-item.owned .wish-title {
      color: var(--ok);
    }

    .wish-item.owned img {
      opacity: .78;
    }

    .wish-controls {
      display: flex;
      flex-direction: column;
      gap: 7px;
      align-items: center;
    }

    .owned-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #11141c;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
    }

    .owned-btn:hover {
      color: var(--ok);
      border-color: rgba(155,230,187,.35);
    }

    .owned-btn.active {
      color: var(--ok);
      border-color: rgba(155,230,187,.45);
      background: rgba(155,230,187,.11);
    }

    .wish-item:last-child { border-bottom: 0; }
    .wish-item img { width: 74px; height: 46px; object-fit: contain; filter: drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
    .wish-title { font-size: 13px; font-weight: 650; line-height: 1.28; }
    .wish-meta { margin-top: 3px; color: var(--muted); font-size: 11px; }




    .share-tools {
      display: grid;
      gap: 8px;
      padding: 0 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .share-buttons {
      display: grid;
      grid-template-columns: 1.2fr .9fr 1fr;
      gap: 8px;
    }

    .share-buttons .btn {
      padding: 8px 10px;
      font-size: 13px;
    }

    #shareCodeInput {
      min-height: 74px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.35;
    }

    @media (max-width: 740px) {
      .share-buttons {
        grid-template-columns: 1fr;
      }
    }

    .wishlist-tools {
      display: flex;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .wishlist-tools .btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 13px;
    }

    .family-group {
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(15,17,21,.45);
    }

    .family-group + .family-group {
      margin-top: 12px;
    }

    .family-head {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.025);
      color: var(--soft);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 11px 12px;
      font: inherit;
      font-weight: 800;
      text-align: left;
    }

    .family-head:hover { background: rgba(255,255,255,.045); }

    .family-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .family-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
    }

    .family-group.collapsed > .family-body { display: none; }
    .family-group.collapsed > .family-head { border-bottom: 0; }
    .family-group .weapon-group { border-radius: 14px; background: rgba(15,17,21,.36); }
    .family-group .weapon-group + .weapon-group { margin-top: 0; }
    .family-group .weapon-head { padding-left: 10px; padding-right: 10px; }
    .standalone-items { display: block; }

    .wish-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 7px;
    }

    .mini-btn {
      border: 1px solid var(--line);
      color: var(--soft);
      background: #11141c;
      border-radius: 9px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.2;
    }

    .mini-btn:hover {
      border-color: rgba(159,179,255,.4);
      color: var(--text);
      background: #181c26;
    }

    .mini-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      border-style: dashed;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #11141c;
      border-radius: 10px;
      cursor: pointer;
    }

    .icon-btn:hover { color: var(--danger); border-color: rgba(255,155,155,.3); }

    .notice {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid rgba(159,179,255,.22);
      background: rgba(159,179,255,.07);
      border-radius: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      padding: 10px 14px;
      border: 1px solid var(--line);
      background: #11141c;
      color: var(--text);
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      box-shadow: var(--shadow);
      z-index: 10;
    }



    .count-partial {
      color: var(--danger);
      font-weight: 750;
    }

    .count-complete {
      color: var(--ok);
      font-weight: 750;
    }

    .toolbar-info {
      display: inline-flex;
      align-items: center;
      color: var(--muted);
      font-size: 14px;
      padding: 0 4px;
      min-height: 42px;
    }

    @media (max-width: 740px) {
  
    .count-partial {
      color: var(--danger);
      font-weight: 750;
    }

    .count-complete {
      color: var(--ok);
      font-weight: 750;
    }

    .toolbar-info {
        width: 100%;
        min-height: 0;
        padding-top: 2px;
      }
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    .hidden { display: none !important; }

    @media (max-width: 1050px) {
      .layout { grid-template-columns: 1fr; }
      .wishlist { position: static; }
    }

    @media (max-width: 740px) {
      .app { width: min(100vw - 20px, 1480px); padding-top: 18px; }
      .topbar { grid-template-columns: 1fr; }
      .status { align-items: flex-start; }
      .controls { grid-template-columns: 1fr; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .card { min-height: 238px; }
      .skin-img-wrap { height: 116px; }
    }
  
    /* v7: hard image clamp.
       Some knife/glove PNGs have large transparent/visual bounds and can overlap text.
       These overrides force the image to stay inside its own area. */
    .card {
      position: relative !important;
      overflow: hidden !important;
    }

    .skin-img-wrap {
      height: 118px !important;
      max-height: 118px !important;
      flex: 0 0 118px !important;
      overflow: hidden !important;
      position: relative !important;
      z-index: 1 !important;
      padding: 10px 16px !important;
      isolation: isolate !important;
    }

    .skin-img-wrap img {
      max-width: 88% !important;
      max-height: 94px !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain !important;
      display: block !important;
      pointer-events: none !important;
      user-select: none !important;
      transform: scale(.9) !important;
      transform-origin: center center !important;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.35)) !important;
    }

    .card-body {
      position: relative !important;
      z-index: 5 !important;
      background: linear-gradient(180deg, rgba(24,27,34,1), rgba(18,21,29,1)) !important;
      border-top: 1px solid var(--line) !important;
    }

    @media (max-width: 740px) {
      .skin-img-wrap {
        height: 104px !important;
        max-height: 104px !important;
        flex-basis: 104px !important;
      }

      .skin-img-wrap img {
        max-height: 78px !important;
        max-width: 84% !important;
        transform: scale(.84) !important;
      }
    }

  
    /* v19 layout switch + redesigned wishlist mode */
    .view-switch {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(17, 20, 28, .88);
      color: var(--muted);
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
      user-select: none;
    }

    .view-switch:hover {
      border-color: rgba(159,179,255,.42);
      background: rgba(24,28,38,.95);
      transform: translateY(-1px);
    }

    .view-switch-label {
      font-size: 12px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: .01em;
    }

    .view-switch-track {
      width: 48px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(159,179,255,.28);
      background: rgba(15,17,21,.9);
      padding: 3px;
      position: relative;
      flex: 0 0 auto;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.025);
    }

    .view-switch-thumb {
      width: 18px;
      height: 18px;
      display: block;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 4px 14px rgba(159,179,255,.34);
      transform: translateX(0);
      transition: transform .18s ease, background .18s ease;
    }

    .view-switch.active {
      color: var(--soft);
      border-color: rgba(155,230,187,.28);
      background: rgba(155,230,187,.055);
    }

    .view-switch.active .view-switch-track {
      border-color: rgba(155,230,187,.36);
    }

    .view-switch.active .view-switch-thumb {
      transform: translateX(22px);
      background: var(--ok);
      box-shadow: 0 4px 14px rgba(155,230,187,.28);
    }

    .layout.wishlist-view {
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 18px;
    }

    .layout.wishlist-view .wishlist {
      order: 1;
      position: static;
      width: 100%;
      border-color: rgba(155,230,187,.18);
      background:
        radial-gradient(circle at top left, rgba(155,230,187,.055), transparent 24rem),
        rgba(21,24,33,.86);
    }

    .layout.wishlist-view .search-panel {
      order: 2;
      position: sticky;
      top: 16px;
      align-self: start;
      width: 100%;
      border-color: rgba(159,179,255,.16);
      background:
        radial-gradient(circle at top right, rgba(159,179,255,.08), transparent 18rem),
        rgba(16,18,25,.92);
    }

    .layout.wishlist-view .wishlist .wish-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 14px;
      align-items: start;
    }

    .layout.wishlist-view .wishlist .family-group + .family-group {
      margin-top: 0;
    }

    .layout.wishlist-view .wishlist .family-group {
      background: rgba(15,17,21,.54);
      border-color: rgba(60,65,75,.88);
    }

    .layout.wishlist-view .wishlist .family-head {
      min-height: 52px;
      padding: 13px 14px;
      font-size: 16px;
      background: linear-gradient(90deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
    }

    .layout.wishlist-view .wishlist .family-body {
      padding: 12px;
      gap: 12px;
    }

    .layout.wishlist-view .wishlist .weapon-head {
      padding: 11px 12px;
      font-size: 15px;
    }

    .layout.wishlist-view .wishlist .wish-item {
      grid-template-columns: 92px minmax(0, 1fr) auto;
      gap: 12px;
      padding: 12px;
    }

    .layout.wishlist-view .wishlist .wish-item img {
      width: 88px;
      height: 56px;
    }

    .layout.wishlist-view .wishlist .wish-title {
      font-size: 14px;
    }

    .layout.wishlist-view .search-panel .controls {
      grid-template-columns: 1fr;
      padding: 14px;
      gap: 10px;
    }

    .layout.wishlist-view .search-panel .toolbar {
      padding: 12px 14px;
      gap: 8px;
    }

    .layout.wishlist-view .search-panel .toolbar .btn {
      padding: 8px 10px;
      font-size: 13px;
    }

    .layout.wishlist-view .search-panel .toolbar-info {
      width: 100%;
      min-height: 0;
      padding-top: 2px;
      font-size: 12px;
    }

    .layout.wishlist-view .search-panel .content {
      max-height: calc(100vh - 278px);
      overflow: auto;
      padding: 14px;
    }

    .layout.wishlist-view .search-panel .grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .layout.wishlist-view .search-panel .card {
      min-height: 0 !important;
      display: grid !important;
      grid-template-columns: 92px minmax(0, 1fr);

<body>
  <main class="app">

    <section id="layout" class="layout">

  <div id="toast" class="toast"></div>

  <script>
    const DATA_URL = "https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins.json";
    const STORAGE_KEY = "cs2_skin_wishlist_v1";
    const COLLAPSE_STORAGE_KEY = "cs2_skin_wishlist_collapsed_groups_v1";
    const LAYOUT_STORAGE_KEY = "cs2_skin_wishlist_layout_mode_v1";
    const MAX_PER_WEAPON = 5;
    const MAX_PER_SPECIAL_GROUP = 10;
    const PAGE_SIZE = 80;

    const state = {
      allSkins: [],
      filteredSkins: [],
      wishlist: [],
      collapsedGroups: new Set(),
      visibleCount: PAGE_SIZE,
      filters: { search: "", category: "", weapon: "" }
    };

    const els = {
      layout: document.getElementById("layout"),
      dataDot: document.getElementById("dataDot"),
      dataStatus: document.getElementById("dataStatus"),
      wishCount: document.getElementById("wishCount"),
      viewToggleBtn: document.getElementById("viewToggleBtn"),
      resultInfo: document.getElementById("resultInfo"),
      searchInput: document.getElementById("searchInput"),
      weaponSelect: document.getElementById("weaponSelect"),
      resetFiltersBtn: document.getElementById("resetFiltersBtn"),
      showMoreBtn: document.getElementById("showMoreBtn"),
      skinsGrid: document.getElementById("skinsGrid"),
      emptySearch: document.getElementById("emptySearch"),
      wishlist: document.getElementById("wishlist"),
      emptyWishlist: document.getElementById("emptyWishlist"),
      collapseAllBtn: document.getElementById("collapseAllBtn"),
      expandAllBtn: document.getElementById("expandAllBtn"),
      generateCodeBtn: document.getElementById("generateCodeBtn"),
      copyCodeBtn: document.getElementById("copyCodeBtn"),
      loadCodeBtn: document.getElementById("loadCodeBtn"),
      shareCodeInput: document.getElementById("shareCodeInput"),
      exportBtn: document.getElementById("exportBtn"),
      importInput: document.getElementById("importInput"),
      clearBtn: document.getElementById("clearBtn"),
      toast: document.getElementById("toast")
    };

    function normalizeSkin(raw) {
      return {
        id: raw.id,
        name: raw.name || "Unknown skin",
        weapon: raw.weapon?.name || "Unknown",
        weaponId: raw.weapon?.id || "unknown",
        category: raw.category?.name || "Other",
        rarity: raw.rarity?.name || "",
        rarityColor: raw.rarity?.color || "#8b93a3",
        image: raw.image || raw.image_url || raw.image_url_steam || "",
        minFloat: raw.min_float ?? null,
        maxFloat: raw.max_float ?? null,
        paintIndex: raw.paint_index ?? raw.paintIndex ?? raw.paintindex ?? null,
        owned: Boolean(raw.owned)
      };
    }

    function setLayoutMode(mode, shouldSave = true) {
      const wishlistMode = mode === "wishlist";

      if (els.layout) {
        els.layout.classList.toggle("wishlist-view", wishlistMode);
      }

      if (els.viewToggleBtn) {
        els.viewToggleBtn.classList.toggle("active", wishlistMode);
        els.viewToggleBtn.setAttribute("aria-pressed", String(wishlistMode));
        els.viewToggleBtn.title = wishlistMode
          ? "Показать базу слева"
          : "Показать wishlist слева";
      }

      if (shouldSave) {
        localStorage.setItem(LAYOUT_STORAGE_KEY, wishlistMode ? "wishlist" : "skins");
      }
    }

    function loadLayoutMode() {
      const mode = localStorage.getItem(LAYOUT_STORAGE_KEY);
      setLayoutMode(mode === "wishlist" ? "wishlist" : "skins", false);
    }

    function toggleLayoutMode() {
      const wishlistMode = els.layout && els.layout.classList.contains("wishlist-view");
      setLayoutMode(wishlistMode ? "skins" : "wishlist");
    }

    function saveWishlist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.wishlist)); }

    function loadWishlist() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        state.wishlist = stored ? JSON.parse(stored) : [];
      } catch { state.wishlist = []; }
    }

    function saveCollapsedGroups() {
      localStorage.setItem(COLLAPSE_STORAGE_KEY, JSON.stringify([...state.collapsedGroups]));
    }

    function loadCollapsedGroups() {
      try {
        const stored = localStorage.getItem(COLLAPSE_STORAGE_KEY);
        state.collapsedGroups = new Set(stored ? JSON.parse(stored) : []);
      } catch { state.collapsedGroups = new Set(); }
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getWishlistGroupKey(item) {
      if (item.category === "Knives") return "Knives";
      if (item.category === "Gloves") return "Gloves";
      return item.weapon;
    }

    function getWishlistGroupLimit(groupKey) {
      return groupKey === "Knives" || groupKey === "Gloves"
        ? MAX_PER_SPECIAL_GROUP
        : MAX_PER_WEAPON;
    }

    function isOwned(item) {
      return Boolean(item.owned);
    }

    function getWishlistGroupCount(groupKey) {
      return state.wishlist.filter(item => getWishlistGroupKey(item) === groupKey && !isOwned(item)).length;
    }

    function isInWishlist(id) { return state.wishlist.some(item => item.id === id); }

    function addToWishlist(id) {
      const skin = state.allSkins.find(item => item.id === id);
      if (!skin) return;

      if (isInWishlist(id)) {
        showToast("Уже добавлено");
        return;
      }

      const groupKey = getWishlistGroupKey(skin);
      const groupLimit = getWishlistGroupLimit(groupKey);

      if (getWishlistGroupCount(groupKey) >= groupLimit) {
        showToast(`Лимит: ${groupLimit} вариантов для ${groupKey}`);
        return;
      }

      state.wishlist.push({ ...skin, owned: false });
      saveWishlist();
      renderWishlist();
      renderSkins();
      showToast("Добавлено");
    }

    function removeFromWishlist(id) {
      state.wishlist = state.wishlist.filter(item => item.id !== id);
      saveWishlist();
      renderWishlist();
      renderSkins();
      showToast("Удалено");
    }

    function toggleOwnedStatus(id) {
      const item = state.wishlist.find(item => item.id === id);
      if (!item) return;

      item.owned = !Boolean(item.owned);
      saveWishlist();
      renderWishlist();
      renderSkins();
      showToast(item.owned ? "Отмечено как имеющееся" : "Снова считается в wishlist");
    }

    const DEF_INDEX_BY_WEAPON = {
      "Desert Eagle": 1,
      "Dual Berettas": 2,
      "Five-SeveN": 3,
      "Glock-18": 4,
      "AK-47": 7,
      "AUG": 8,
      "AWP": 9,
      "FAMAS": 10,
      "G3SG1": 11,
      "Galil AR": 13,
      "M249": 14,
      "M4A4": 16,
      "MAC-10": 17,
      "P90": 19,
      "MP5-SD": 23,
      "UMP-45": 24,
      "XM1014": 25,
      "PP-Bizon": 26,
      "MAG-7": 27,
      "Negev": 28,
      "Sawed-Off": 29,
      "Tec-9": 30,
      "Zeus x27": 31,
      "P2000": 32,
      "MP7": 33,
      "MP9": 34,
      "Nova": 35,
      "P250": 36,
      "SCAR-20": 38,
      "SG 553": 39,
      "SSG 08": 40,
      "M4A1-S": 60,
      "USP-S": 61,
      "CZ75-Auto": 63,
      "R8 Revolver": 64,

      "Bayonet": 500,
      "Classic Knife": 503,
      "Flip Knife": 505,
      "Gut Knife": 506,
      "Karambit": 507,
      "M9 Bayonet": 508,
      "Huntsman Knife": 509,
      "Falchion Knife": 512,
      "Bowie Knife": 514,
      "Butterfly Knife": 515,
      "Shadow Daggers": 516,
      "Paracord Knife": 517,
      "Survival Knife": 518,
      "Ursus Knife": 519,
      "Navaja Knife": 520,
      "Nomad Knife": 521,
      "Stiletto Knife": 522,
      "Talon Knife": 523,
      "Skeleton Knife": 525,
      "Kukri Knife": 526,

      "Bloodhound Gloves": 5027,
      "Sport Gloves": 5030,
      "Driver Gloves": 5031,
      "Hand Wraps": 5032,
      "Moto Gloves": 5033,
      "Specialist Gloves": 5034,
      "Hydra Gloves": 5035,
      "Broken Fang Gloves": 4725
    };

    const RARITY_VALUE_BY_NAME = {
      "Consumer Grade": 1,
      "Base Grade": 1,
      "Industrial Grade": 2,
      "Mil-Spec Grade": 3,
      "Restricted": 4,
      "Classified": 5,
      "Covert": 6,
      "Extraordinary": 6,
      "Contraband": 7
    };

    let crcTable = null;

    function getCrcTable() {
      if (crcTable) return crcTable;

      crcTable = new Uint32Array(256);

      for (let n = 0; n < 256; n++) {
        let c = n;

        for (let k = 0; k < 8; k++) {
          c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        }

        crcTable[n] = c >>> 0;
      }

      return crcTable;
    }

    function crc32(bytes) {
      const table = getCrcTable();
      let crc = 0 ^ -1;

      for (let i = 0; i < bytes.length; i++) {
        crc = (crc >>> 8) ^ table[(crc ^ bytes[i]) & 0xFF];
      }

      return (crc ^ -1) >>> 0;
    }

    function encodeVarint(value) {
      let n = Number(value) >>> 0;
      const out = [];

      while (n >= 0x80) {
        out.push((n & 0x7F) | 0x80);
        n = n >>> 7;
      }

      out.push(n);
      return out;
    }

    function encodeField(fieldNumber, value) {
      return [
        ...encodeVarint((fieldNumber << 3) | 0),
        ...encodeVarint(value)
      ];
    }

    function floatToUint32(value) {
      const buffer = new ArrayBuffer(4);
      const view = new DataView(buffer);
      view.setFloat32(0, Number(value), true);
      return view.getUint32(0, true);
    }

    function uint32ToBigEndianBytes(value) {
      return [
        (value >>> 24) & 0xFF,
        (value >>> 16) & 0xFF,
        (value >>> 8) & 0xFF,
        value & 0xFF
      ];
    }

    function bytesToHex(bytes) {
      return Array.from(bytes)
        .map(byte => byte.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function getDefIndex(item) {
      return DEF_INDEX_BY_WEAPON[item.weapon] || null;
    }

    function isVanillaKnife(item) {
      return item.category === "Knives" && (
        item.paintIndex === null ||
        item.paintIndex === undefined ||
        item.paintIndex === "" ||
        Number(item.paintIndex) === 0
      );
    }

    function getPaintIndex(item) {
      const value = Number(item.paintIndex);

      if (Number.isFinite(value) && value > 0) {
        return Math.trunc(value);
      }

      if (isVanillaKnife(item)) {
        return 0;
      }

      return null;
    }

    function getRarityValue(item) {
      if (RARITY_VALUE_BY_NAME[item.rarity]) return RARITY_VALUE_BY_NAME[item.rarity];
      if (item.category === "Knives" || item.category === "Gloves") return 6;
      return 4;
    }

    function getDefaultWear(item) {
      if (isVanillaKnife(item)) {
        return 0;
      }

      const min = Number(item.minFloat);
      const max = Number(item.maxFloat);

      let wear = Number.isFinite(min) ? min : 0;

      if (wear <= 0) wear = 0.001;
      if (Number.isFinite(max) && wear > max) wear = max;
      if (Number.isFinite(min) && wear < min) wear = min;

      return Number(wear.toFixed(6));
    }

    function canGenerateInspect(item) {
      const defindex = getDefIndex(item);
      const paintindex = getPaintIndex(item);

      return Boolean(defindex !== null && defindex !== undefined && paintindex !== null && paintindex !== undefined);
    }

    function generateInspectHex(item) {
      const defindex = getDefIndex(item);
      const paintindex = getPaintIndex(item);
      const rarity = getRarityValue(item);
      const quality = 4;
      const paintwear = floatToUint32(getDefaultWear(item));
      const paintseed = 0;

      const proto = [
        ...encodeField(3, defindex),
        ...encodeField(4, paintindex),
        ...encodeField(5, rarity),
        ...encodeField(6, quality),
        ...encodeField(7, paintwear),
        ...encodeField(8, paintseed)
      ];

      const buffer = new Uint8Array(1 + proto.length);
      buffer[0] = 0;
      buffer.set(proto, 1);

      const crc = crc32(buffer);
      const xoredCrc = (((crc & 0xFFFF) ^ Math.imul(proto.length, crc)) >>> 0);
      const finalBuffer = new Uint8Array(buffer.length + 4);

      finalBuffer.set(buffer);
      finalBuffer.set(uint32ToBigEndianBytes(xoredCrc), buffer.length);

      return bytesToHex(finalBuffer);

    function copyText(value) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(value);
      }

      const textarea = document.createElement("textarea");
      textarea.value = value;
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();

      try {
        document.execCommand("copy");
        return Promise.resolve();
      } catch {
        return Promise.reject();
      } finally {
        textarea.remove();
      }
    }

    function getWishlistFamilyKey(item) {
      if (item.category === "Gloves") return "Gloves";
      if (item.category === "Knives") return "Knives";
      if (item.category === "Rifles") return "Rifles";
      if (item.category === "Sniper Rifles") return "Snipers";
      if (item.category === "SMGs") return "SMG";
      if (item.category === "Pistols") return "Pistols";
      if (item.category === "Heavy") return "Heavy";
      if (item.weapon === "Zeus x27") return "Zeus x27";
      return item.category || "Other";
    }

    function getCollapseKey(type, key) { return `${type}:${key}`; }

    function groupWishlist() {
      const families = new Map();

      for (const item of state.wishlist) {
        const familyKey = getWishlistFamilyKey(item);
        const groupKey = getWishlistGroupKey(item);
        const standalone = familyKey === "Gloves" || familyKey === "Knives" || familyKey === "Zeus x27";

        if (!families.has(familyKey)) {
          families.set(familyKey, { key: familyKey, label: familyKey, standalone, items: [], children: new Map() });
        }

        const family = families.get(familyKey);

        if (standalone) {
          family.items.push(item);
        } else {
          if (!family.children.has(groupKey)) family.children.set(groupKey, { key: groupKey, label: groupKey, items: [] });
          family.children.get(groupKey).items.push(item);
        }
      }

      const order = ["Gloves", "Knives", "Rifles", "Snipers", "SMG", "Pistols", "Heavy", "Zeus x27", "Other"];

      return [...families.values()].sort((a, b) => {
        const ai = order.indexOf(a.key), bi = order.indexOf(b.key);
        if (ai !== -1 || bi !== -1) {
          if (ai === -1) return 1;
          if (bi === -1) return -1;
          return ai - bi;
        }
        return a.label.localeCompare(b.label);
      }).map(family => ({ ...family, children: [...family.children.values()].sort((a, b) => a.label.localeCompare(b.label)) }));
    }

    function countActiveWishlistItems(items) {
      return items.filter(item => !isOwned(item)).length;
    }

    function sortWishlistItems(items) {
      return [...items].sort((a, b) => Number(isOwned(a)) - Number(isOwned(b)));
    }

    function getGroupItemCount(group) {
      if (group.standalone) return countActiveWishlistItems(group.items);
      return group.children.reduce((sum, child) => sum + countActiveWishlistItems(child.items), 0);
    }

    function encodeSharePayload(payload) {
      const json = JSON.stringify(payload);
      const bytes = new TextEncoder().encode(json);
      let binary = "";

      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return "CS2W1." + btoa(binary)
        .replaceAll("+", "-")
        .replaceAll("/", "_")
        .replaceAll("=", "");
    }

    function decodeShareCode(code) {
      let value = String(code || "").trim();

      if (!value) {
        throw new Error("Empty code");
      }

      if (value.startsWith("CS2W1.")) {
        value = value.slice("CS2W1.".length);
      }

      value = value.replaceAll("-", "+").replaceAll("_", "/");

      while (value.length % 4) {
        value += "=";
      }

      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);

      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function buildWishlistFromEntries(entries) {
      const byId = new Map(state.allSkins.map(item => [item.id, item]));
      const next = [];

      for (const entry of entries) {
        const id = typeof entry === "string" ? entry : entry?.id;
        const owned = typeof entry === "object" && entry ? Boolean(entry.owned) : false;
        const skin = byId.get(id);

        if (!skin) continue;
        if (next.some(item => item.id === skin.id)) continue;

        const groupKey = getWishlistGroupKey(skin);
        const groupLimit = getWishlistGroupLimit(groupKey);
        const groupCount = next.filter(item => getWishlistGroupKey(item) === groupKey && !isOwned(item)).length;

        if (!owned && groupCount >= groupLimit) continue;

        next.push({ ...skin, owned });
      }

      return next;
    }

    function generateWishlistCode() {
      if (!state.wishlist.length) {
        showToast("Wishlist пустой");
        return;
      }

      const payload = {
        app: "CS2 Skin Wishlist",
        version: 2,
        createdAt: new Date().toISOString(),
        ids: state.wishlist.map(item => item.id),
        items: state.wishlist.map(item => ({ id: item.id, owned: Boolean(item.owned) }))
      };

      const code = encodeSharePayload(payload);
      els.shareCodeInput.value = code;

      copyText(code)
        .then(() => showToast("Код создан и скопирован"))
        .catch(() => showToast("Код создан"));
    }

    function copyWishlistCode() {
      const code = els.shareCodeInput.value.trim();

      if (!code) {
        showToast("Сначала сгенерируй или вставь код");
        return;
      }

      copyText(code)
        .then(() => showToast("Код скопирован"))
        .catch(() => alert("Не удалось скопировать код. Скопируй вручную."));
    }

    function loadWishlistCode() {
      const code = els.shareCodeInput.value.trim();

      if (!code) {
        showToast("Вставь код списка");
        return;
      }

      let payload;

      try {
        payload = decodeShareCode(code);
      } catch {
        alert("Код списка не распознан.");
        return;
      }

      const entries = Array.isArray(payload.items)
        ? payload.items
        : Array.isArray(payload.ids)
          ? payload.ids
          : [];

      if (!entries.length) {
        alert("В коде нет скинов.");
        return;
      }

      if (!state.allSkins.length) {
        alert("База скинов ещё не загрузилась. Подожди пару секунд и попробуй снова.");
        return;
      }

      const next = buildWishlistFromEntries(entries);

      if (!next.length) {
        alert("Не удалось найти скины из этого кода в текущей базе.");
        return;
      }

      const shouldReplace = confirm(
        `Загрузить ${next.length} скинов из кода?\\n\\nOK — заменить текущий wishlist.\\nCancel — отменить.`
      );

      if (!shouldReplace) return;

      state.wishlist = next;
      saveWishlist();
      renderWishlist();
      renderSkins();
      showToast("Wishlist загружен из кода");
    }

    function exportWishlist() {
      const payload = { app: "CS2 Skin Wishlist", version: 1, exportedAt: new Date().toISOString(), maxPerWeapon: MAX_PER_WEAPON, maxPerSpecialGroup: MAX_PER_SPECIAL_GROUP, items: state.wishlist };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "cs2-skin-wishlist.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importWishlist(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          const items = Array.isArray(parsed) ? parsed : parsed.items;
          if (!Array.isArray(items)) throw new Error("Invalid format");
          const next = [];
          for (const item of items) {
            const normalized = normalizeSkin(item);
            if (next.some(x => x.id === normalized.id)) continue;
            const groupKey = getWishlistGroupKey(normalized);
            if (!isOwned(normalized) && next.filter(x => getWishlistGroupKey(x) === groupKey && !isOwned(x)).length >= getWishlistGroupLimit(groupKey)) continue;
            next.push(normalized);
          }
          state.wishlist = next;
          saveWishlist();
          renderWishlist();
          renderSkins();
          showToast("Import готов");
        } catch { alert("Не удалось импортировать JSON."); }
      };
      reader.readAsText(file);
      if (els.importInput) els.importInput.value = "";
    }

    function bindEvents() {
      els.searchInput.addEventListener("input", () => { state.filters.search = els.searchInput.value; state.visibleCount = PAGE_SIZE; applyFilters(); });
      els.weaponSelect.addEventListener("change", () => { state.filters.weapon = els.weaponSelect.value; state.visibleCount = PAGE_SIZE; applyFilters(); });
      els.resetFiltersBtn.addEventListener("click", () => {
        state.filters = { search: "", weapon: "" };
        state.visibleCount = PAGE_SIZE;
        els.searchInput.value = "";
        els.weaponSelect.value = "";
        applyFilters();
      });
      els.showMoreBtn.addEventListener("click", () => { state.visibleCount += PAGE_SIZE; renderSkins(); });
      if (els.exportBtn) els.exportBtn.addEventListener("click", exportWishlist);
      if (els.importInput) els.importInput.addEventListener("change", () => importWishlist(els.importInput.files[0]));
      if (els.clearBtn) els.clearBtn.addEventListener("click", clearWishlist);
      if (els.collapseAllBtn) els.collapseAllBtn.addEventListener("click", collapseAllWishlistGroups);
      if (els.expandAllBtn) els.expandAllBtn.addEventListener("click", expandAllWishlistGroups);
      if (els.generateCodeBtn) els.generateCodeBtn.addEventListener("click", generateWishlistCode);
      if (els.copyCodeBtn) els.copyCodeBtn.addEventListener("click", copyWishlistCode);
      if (els.loadCodeBtn) els.loadCodeBtn.addEventListener("click", loadWishlistCode);
      if (els.viewToggleBtn) els.viewToggleBtn.addEventListener("click", toggleLayoutMode);
    }

    async function loadData() {
      try {
        const res = await fetch(DATA_URL, { cache: "force-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();
        state.allSkins = raw
          .map(normalizeSkin)
          .filter(item => item.id && item.image && item.weapon !== "Unknown")
          .filter(isAllowedSkin)
          .sort((a, b) => a.category.localeCompare(b.category) || a.weapon.localeCompare(b.weapon) || a.name.localeCompare(b.name));
        state.filteredSkins = [...state.allSkins];
        els.dataDot.classList.add("ok");
        els.dataStatus.textContent = `${state.allSkins.length} skins loaded`;
        populateFilters();
        applyFilters();
      } catch (err) {
        els.dataDot.classList.add("bad");
        els.dataStatus.textContent = "Ошибка загрузки базы";
        if (els.resultInfo) els.resultInfo.textContent = "База не загрузилась";
        els.emptySearch.classList.remove("hidden");
        els.emptySearch.textContent = "Не удалось загрузить skins.json. Проверь интернет или CORS.";
        console.error(err);
      }
    }

    loadWishlist();
    loadCollapsedGroups();
    bindEvents();
    loadLayoutMode();
    renderWishlist();
    loadData();
  </script>
</body>
</html>
